name: Épingles vidéo Pinterest

# Se lance à la main (onglet Actions → Épingles vidéo Pinterest → Run workflow).
# Crée pinterest2_video_prueba.csv (3 vidéos, si « Essai » est coché)
# ou pinterest2_video_mois1.csv, pinterest2_video_mois2.csv… (1 vidéo par jour à 16 h 15).
on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Premier jour de publication (AAAA-MM-JJ). Vide = demain"
        default: ""
        required: false
      prueba:
        description: "Essai avec 3 vidéos"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  pines-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers
        env:
          INICIO: ${{ inputs.inicio }}
          PRUEBA: ${{ inputs.prueba }}
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          BASE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          ARGS=(--base "$BASE")
          [ -n "$INICIO" ] && ARGS+=(--inicio "$INICIO")
          [ "$PRUEBA" = "true" ] && ARGS+=(--prueba)
          cd fabrica && python3 pines_video.py "${ARGS[@]}"

      - name: Enregistrer
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git add pinterest2_video_*.csv
          git commit -m "Épingles vidéo Pinterest" || exit 0
          git pull --rebase
          git push
