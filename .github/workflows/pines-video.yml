name: Lots Pinterest (images + vidéos)

# Se lance à la main, une seule fois (onglet Actions → Lots Pinterest → Run workflow).
# Crée pinterest2_lot01.csv, pinterest2_lot02.csv… : 14 jours chacun,
# 1 image à 11 h 15 + 1 vidéo à 21 h 15 (heure de Paris). Importer chaque lot 2 ou 3 jours avant sa 1re date.
# Supprime les anciens fichiers remplacés (pinterest2_mois2.csv, pinterest2_mois3.csv, pinterest2_video_prueba.csv).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  lots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les lots
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          BASE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          cd fabrica && python3 pines_lots.py --base "$BASE"

      - name: Enregistrer
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git rm -q --ignore-unmatch pinterest2_mois2.csv pinterest2_mois3.csv pinterest2_video_prueba.csv
          git add pinterest2_lot*.csv
          git commit -m "Lots Pinterest" || exit 0
          git pull --rebase
          git push
